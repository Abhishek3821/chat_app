# Render blueprint for the ChatKonect backend.
# In Render: New → Blueprint → point at this repo. Set the "sync: false" vars
# (MONGO_URI, CLIENT_URL) in the dashboard after the first deploy.
services:
  - type: web
    name: chatkonect-api
    runtime: node
    rootDir: server
    # NOTE: "free" instances SLEEP after ~15 min idle (≈50 s cold start) and drop
    # every held Socket.IO connection — fine for demos, unfit for real users.
    # Move to an always-on paid plan (starter+) before launch.
    plan: free
    # Keep 1 instance until REDIS_URL is set: presence, rate limits and socket
    # fan-out are in-memory without Redis and would silently break across a fleet.
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      # Token lifetimes actually read by the code (utils/token.js / utils/session.js):
      - key: JWT_ACCESS_EXPIRES
        value: 1h
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: MONGO_URI
        sync: false # set in dashboard (MongoDB Atlas SRV string incl. /chatconnect)
      - key: CLIENT_URL
        sync: false # set to your deployed frontend origin, e.g. https://chatkonect.vercel.app
      # ── Media storage ──────────────────────────────────────────
      # REQUIRED for production: Render's disk is EPHEMERAL — locally stored
      # avatars/attachments/status media are wiped on every deploy or restart.
      # Set CLOUDINARY_URL in the dashboard (cloudinary://key:secret@cloud).
      # (Falls back to local disk if CLOUDINARY_URL is left unset.)
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      # Optional: Redis for multi-instance socket fan-out, shared rate limits
      # and the BullMQ job queue. Required before raising numInstances above 1.
      # - key: REDIS_URL
      #   sync: false
      # Optional: LiveKit SFU for meetings — lets a room scale past the
      # ~6-person peer-to-peer mesh ceiling. Free tier at livekit.io. Unset →
      # meetings fall back to the mesh automatically (no code change needed).
      # - key: LIVEKIT_URL
      #   sync: false
      # - key: LIVEKIT_API_KEY
      #   sync: false
      # - key: LIVEKIT_API_SECRET
      #   sync: false
      # Email verification is ON: signup issues an OTP that must be verified
      # before the account can log in. Requires the SMTP vars below to be set in
      # the dashboard (the pipeline is built and verified). PIN reset ("forgot
      # chat-lock PIN") uses the same mailer.
      - key: ENABLE_EMAIL_VERIFICATION
        value: "true"
      # ⚠ Render's FREE plan blocks outbound SMTP ports (25/465/587) — SMTP can
      # NEVER work on it. Either upgrade the plan, or set BREVO_API_KEY (HTTPS
      # email, works on free). When set it takes priority over the SMTP vars.
      - key: BREVO_API_KEY
        sync: false
      # SMTP — set these in the dashboard (paid plans only; see note above):
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Display name only is fine — the code binds it to the authenticated
      # mailbox (relays reject a From that isn't on the account's domain).
      - key: EMAIL_FROM
        value: ChatKonect
      # Web Push (VAPID) — notifications when the app is closed.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:abhisheksingh@capyngen.com # real, monitored contact (push services may use it to reach you)
      # ── TURN relay: REQUIRED for calls between different networks ──
      # Calls are peer-to-peer. Without a relay, two people behind symmetric NAT
      # or CGNAT (mobile data, office wifi — i.e. two different cities) get a call
      # that rings, connects, and carries no audio or video. Chat is unaffected,
      # which is why this looks like an app bug rather than a missing setting.
      #
      # Fill in EITHER route in the dashboard (or both — own relays are offered
      # first and Cloudflare becomes the fallback):
      #
      # A) Your own coturn. deploy/turn/install-coturn.sh sets up a box and prints
      #    both values. Several relays: separate with "|", nearest first.
      - key: TURN_URL
        sync: false
      - key: TURN_SECRET
        sync: false
      # B) Cloudflare TURN — dashboard → Calls → TURN keys. No box to run.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Verify after setting either: node deploy/turn/check-relay.mjs --env
      # The API logs which providers loaded at boot.
      # Optional: comma-separated additional allowed origins
      # - key: EXTRA_CORS_ORIGINS
      #   value: https://staging.yourdomain.com
