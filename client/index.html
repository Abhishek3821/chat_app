<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme, resolved BEFORE first paint.

      The dark class used to be hard-coded on the <html> tag, so every
      light-mode user got a full dark repaint on every single load: the document
      painted navy, then React mounted, read the stored preference and tore it
      back to mint.
      Inline and synchronous on purpose — a module script or a React effect both
      run after the first paint, which is precisely too late.

      theme-color is set here too (it was pinned to the dark navy), so the mobile
      browser chrome and the PWA status bar match the app instead of framing a
      pale-mint UI in navy.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cc_theme') || 'dark';
          var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#071A2B' : '#E4F2EA');
        } catch (e) {
          /* private mode / storage blocked — fall through to the default below */
        }
      })();
    </script>
    <meta name="theme-color" content="#071A2B" />
    <meta name="description" content="ChatKonect — a modern, premium real-time messaging platform." />
    <!-- PWA: installable + offline app shell -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatKonect" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-render-blocking font load (preload + print-media swap trick): the
      fetch starts immediately (preload, high priority) but doesn't block first
      paint the way a plain `rel="stylesheet"` would — the stylesheet applies
      once loaded by swapping its media from "print" to "all". `display=swap`
      (in the URL) means text renders in the fallback font immediately either
      way, so nothing is ever invisible while this loads.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>ChatKonect — Talk, meet & connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
