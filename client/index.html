<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme, resolved BEFORE first paint.

      The dark class used to be hard-coded on the <html> tag, so every
      light-mode user got a full dark repaint on every single load: the document
      painted navy, then React mounted, read the stored preference and tore it
      back to mint.
      Synchronous (classic, non-module) on purpose — a module script or a React
      effect both run after the first paint, which is precisely too late. It is
      an external file, not inline, because the production CSP is
      `script-src 'self'` and refuses inline scripts.

      theme-color is set there too (it was pinned to the dark navy), so the mobile
      browser chrome and the PWA status bar match the app instead of framing a
      pale-mint UI in navy. The same file also starts the web-font load.
    -->
    <script src="/theme-init.js"></script>
    <meta name="theme-color" content="#071A2B" />
    <meta name="description" content="ChatKonect — a modern, premium real-time messaging platform." />
    <!-- PWA: installable + offline app shell -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatKonect" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-render-blocking font load (preload + print-media swap trick): the
      fetch starts immediately (preload, high priority) but doesn't block first
      paint the way a plain `rel="stylesheet"` would. The stylesheet itself is
      added by /theme-init.js, which swaps its media from "print" to "all" once
      loaded — done from script because an inline `onload=` attribute is blocked
      by the production CSP. `display=swap` (in the URL) means text renders in
      the fallback font immediately either way.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>ChatKonect — Talk, meet & connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
