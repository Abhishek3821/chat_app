name: CI

# Gate before merge: the client must build, and the server test suites must
# pass. The suites hit a real MongoDB Atlas cluster (see server/tests/ — they
# derive an isolated `_e2e` database and drop it, never touching the real one),
# so they only run when a MONGO_URI secret is configured on this repo. Without
# it they're skipped with a clear notice rather than failing CI on missing
# secrets — add the secret (Settings → Secrets and variables → Actions) to
# turn on full verification.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      # The build alone does NOT catch a reference to something that was deleted:
      # esbuild/oxc do no scope analysis, so a call to a removed helper compiles
      # clean and throws at runtime. That is exactly how a deleted block took
      # RightPanel's `handleDeleteChat` with it and crashed every chat open while
      # CI stayed green. This does the scope check the bundler won't.
      - name: undefined-reference scan
        run: node scan-undefined.mjs
      # Dead buttons, empty handlers, hardcoded dev URLs, debug output shipped to
      # users, and route imports that don't resolve. None of these fail a build;
      # all of them are visible to the first person who clicks the wrong thing.
      # Catches a control wired to a handler prop the parent never passes: it
      # renders, looks live, and silently does nothing. audit-ui only finds buttons
      # with NO handler at all, so this is the complementary half.
      - name: dead-button audit (handler props supplied at every usage)
        run: node audit-buttons.mjs
      # The embed postMessage protocol must match on both sides. Every integration
      # failure on this project has been a name matching on one side only, failing
      # silently — this is the third surface with that exact failure mode.
      - name: embed postMessage protocol (loader vs framed app)
        run: node audit-embed-protocol.mjs
      # Executes the loader against a DOM shim: the iframe it builds (allow= for
      # camera/mic, token NOT in the URL), the token handshake, rotation, and the
      # messages it must ignore. Nothing had ever run this file.
      - name: embed loader handshake (37 checks)
        run: node test-embed-loader.mjs
      - name: UI / production audit
        run: node audit-ui.mjs
      # Invite/QR parsing is pure logic with no DOM, so it can be pinned exactly.
      # It decides whether the Scan button accepts the app's own codes — and it
      # once rejected all of them off an over-strict origin check.
      - name: invite / QR parsing (25 checks)
        run: node test-invite.mjs
      # A colour hardcoded to one theme is invisible in the other, and neither
      # the build nor a screenshot of the theme you happen to be in will say so.
      - name: light/dark contrast audit
        run: node audit-theme.mjs
      # Background effects load a wasm runtime + model over HTTP. Both wasm
      # variants must ship (MediaPipe picks the filename at runtime), the .wasm
      # must carry application/wasm, and the CSP must allow WebAssembly at all.
      # A missing asset does NOT 404 here — the SPA fallback returns HTML — so
      # the failure is otherwise invisible until someone clicks the button.
      - name: background effects — assets, MIME types, CSP (18 checks)
        run: node test-video-effects.mjs

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Skip notice (no MONGO_URI secret configured)
        if: ${{ env.MONGO_URI == '' }}
        run: echo "::warning::MONGO_URI secret not set — skipping server test suites. Add it in repo Settings → Secrets to enable full CI verification."
      - name: e2e suite (54 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/e2e.mjs
      - name: new-features suite
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/new-features.mjs
      - name: push-pipeline suite (11 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/push-pipeline.mjs
      - name: upload-validation suite (11 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/upload-validation.mjs
      - name: chat real-time (edit/delete/react/pin/poll/settings, 26 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/chat-realtime.mjs
      # A full mesh meeting must REFUSE the joiner who would break it, rather than
      # admit everyone and freeze the video for the people already talking. Also
      # pins the two exemptions: the host is never locked out, and an SFU-backed
      # deployment has no ceiling at all.
      - name: meeting capacity is ENFORCED, not just warned (15 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-capacity.mjs
      - name: meeting mesh (3rd/4th joiner sees everyone, 28 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-mesh.mjs
      - name: platform group calls (tenant users, socket + flags, 17 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/platform-calls.mjs
      # Separates "the relay is broken" from "targeted delivery can't cross
      # processes". Proves the 1:1 offer path works on one instance, that typing
      # needs join-chat first, and that a fleet without REDIS_URL reproduces the
      # exact 201-but-"missed" + no-offer + presence-fine symptom triad.
      - name: relay delivery — single vs multi-instance (13 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/relay-delivery.mjs
      # Pins the raw-socket contract an embed partner integrates against: `to` (not
      # the REST `receiverId`) targets a call signal, authorization needs no Call
      # record, and typing is chat-room scoped behind join-chat. A wrong key is
      # dropped silently, which reads exactly like a dead relay.
      - name: embed 1:1 signalling contract (26 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/embed-1to1-signalling.mjs
      # Group create/add/call each return a success status when addressed with the
      # wrong key or route (`participants` vs `members`, PATCH vs POST /:id/members,
      # /calls/start vs /calls), so the mistake reads as a missing feature. Pins
      # both directions.
      - name: embed group chat + group calls (22 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/embed-groups.mjs
      # A tenant-registered origin must never gain ambient-credential access.
      # Feeding App.allowedOrigins into the shared CORS/CSRF allowlist once let any
      # signed-up user register evil.example and read a fresh access token out of
      # /auth/refresh in a logged-in victim's browser. Proves the attack is dead
      # AND that legitimate Bearer traffic from a tenant origin still works.
      - name: SECURITY — embed origin trust tiers (23 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/security-embed-origins.mjs
      # The drop-in embed: config bootstrap, allowedOrigins finally enforced (and
      # against the PARENT origin), and minted time-limited TURN credentials.
      - name: drop-in embed (config, origins, TURN minting, 29 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/embed-dropin.mjs
      # Boots examples/saas-host for real. It is the file integrators copy, so a
      # silent rot there breaks the paste-path while everything else stays green.
      # Also guards realistic externalId lengths, which no other fixture covers.
      - name: example SaaS host, end to end (28 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/embed-host-example.mjs
      - name: group-call mesh (A adds C; B and C must see each other, 20 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/group-call-mesh.mjs
      - name: meeting-room real-time (join/chat/hand/reaction/host controls, 12 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-room-realtime.mjs
      - name: call edge signals — unavailable/handled/cancelled + dash aliases (12 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/call-edges-realtime.mjs
      - name: meeting collaboration — polls, Q&A, captions, deny (24 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-collab-realtime.mjs
      - name: REST-triggered realtime — live location, scheduled, unfriend (18 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/rest-triggered-realtime.mjs
      # Reports which server→client events have NO socket-level proof. Advisory:
      # some events are timer- or third-party-driven and cannot be driven by a test.
      - name: real-time coverage report
        run: node tests/realtime-coverage.mjs || true
      - name: privacy settings save AND are enforced (23 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/privacy-settings.mjs
      - name: group membership, admins + who-can-add-me-to-groups (38 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/group-membership.mjs
      - name: status posts + views are realtime (21 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/status-realtime.mjs
      - name: QR invite — scan, live request card, accept/decline (22 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/qr-invite.mjs
      - name: presence — heartbeat, boot reset, 5-minute idle (20 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/presence.mjs
      # A relay that never allocates and a prober that is silently malformed look
      # identical from the outside — both report failure for every endpoint. This
      # runs the prober against a TURN responder that verifies MESSAGE-INTEGRITY
      # with its own implementation, so a broken prober cannot pass. No database.
      - name: TURN relay prober speaks real TURN (25 checks)
        run: node ../deploy/turn/check-relay.test.mjs
      # Calls are peer-to-peer: without a TURN relay they fail between strict/
      # symmetric NATs (mobile carriers, office networks) — the call rings, both
      # sides accept, then there is no media. Pins that credentials are minted
      # when configured, that the absence is reported rather than hidden, and
      # that a relay NETWORK signs each relay with its own secret — a group with
      # no matching secret must be dropped, never signed with the wrong one,
      # since a credential the relay rejects burns ICE time and reads as an outage.
      - name: TURN relay readiness — credentials, relay network, Cloudflare fallback (54 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/turn-relay.mjs
      # A limiter keyed on the wrong thing puts every caller in ONE bucket, which
      # a single client can never notice — its own requests are counted fine.
      # This sends from two identities and proves the counters are independent.
      - name: rate limits are per client, not global (9 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/rate-limit-keying.mjs
      - name: single super admin auto-provisioned from .env (36 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/super-admin.mjs
      - name: meeting visibility + post-schedule invites (20 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-visibility.mjs
      - name: meeting-invites suite (15 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/meeting-invites.mjs
      - name: feature-coverage suite (81 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/feature-coverage.mjs
      - name: search / wallpaper suite
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/search-wallpaper.mjs
      # Shares a test database with the suite above, so it must not run in
      # parallel with it (the free Atlas tier caps the cluster at 500
      # collections, and one database per suite is what exhausted it).
      - name: pinned-messages suite (43 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/pinned-messages.mjs

      # Static audits — no database needed, so they run even without MONGO_URI
      # and give a fast signal on the two things that break a deploy rather than
      # a test: a client call to a route that doesn't exist, and a config gap.
      - name: API route coverage (client calls vs server routes)
        run: node tests/route-coverage.mjs
      - name: deployment readiness (env vars, secrets, prod guards)
        run: node tests/deploy-readiness.mjs
      # Catches a socket event renamed on one side only, and a getState().method()
      # that no longer exists. Both present to a user as "real time is broken"
      # while the build passes and the server logs nothing.
      - name: real-time wiring (socket event names, store methods, WebRTC flow)
        run: node tests/realtime-wiring.mjs
      # Connects the way the BROWSER does (Origin header, auth callback, transport
      # order) and asserts presence, live delivery, typing, receipts and the full
      # WebRTC offer/answer/ICE relay.
      - name: real-time behaviour, browser-shaped client (17 checks)
        if: ${{ env.MONGO_URI != '' }}
        run: node tests/realtime-browser.mjs
